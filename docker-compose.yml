services:
  cineforest:
    build: .
    container_name: cineforest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-2000}
      # Dans un conteneur, 127.0.0.1 désigne le conteneur lui-même :
      # on passe par host.docker.internal pour joindre l'Ollama de la machine hôte.
      OLLAMA_URL: ${DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT:-2000}:${PORT:-2000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
